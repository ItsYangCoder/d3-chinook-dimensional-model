bundle:
  name: chinook-dimensional-model

variables:
  warehouse_id:
    description: SQL warehouse used by the Chinook SQL tasks.
    default: ""

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    chinook_pipeline:
      name: chinook-dimensional-model-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          sql_task:
            file:
              path: ./src/sql/00_setup/00_setup.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: raw_customer
          depends_on:
            - task_key: setup
          sql_task:
            file:
              path: ./src/sql/01_raw/01_raw_customer.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: raw_sales
          depends_on:
            - task_key: setup
          sql_task:
            file:
              path: ./src/sql/01_raw/02_raw_sales.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: raw_employee
          depends_on:
            - task_key: setup
          sql_task:
            file:
              path: ./src/sql/01_raw/03_raw_employee.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: raw_music
          depends_on:
            - task_key: setup
          sql_task:
            file:
              path: ./src/sql/01_raw/04_raw_music.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: clean_customer
          depends_on:
            - task_key: raw_customer
          sql_task:
            file:
              path: ./src/sql/02_clean/01_clean_customer.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: clean_sales
          depends_on:
            - task_key: raw_sales
          sql_task:
            file:
              path: ./src/sql/02_clean/02_clean_sales.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: clean_employee
          depends_on:
            - task_key: raw_employee
          sql_task:
            file:
              path: ./src/sql/02_clean/03_clean_employee.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: clean_music
          depends_on:
            - task_key: raw_music
          sql_task:
            file:
              path: ./src/sql/02_clean/04_clean_music.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: dim_customer
          depends_on:
            - task_key: clean_customer
            - task_key: clean_employee
          sql_task:
            file:
              path: ./src/sql/03_mart/01_dim_customer.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: dim_date
          depends_on:
            - task_key: clean_sales
          sql_task:
            file:
              path: ./src/sql/03_mart/02_dim_date.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: dim_employee
          depends_on:
            - task_key: clean_employee
          sql_task:
            file:
              path: ./src/sql/03_mart/03_dim_employee.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: dim_track
          depends_on:
            - task_key: clean_music
          sql_task:
            file:
              path: ./src/sql/03_mart/04_dim_track.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: fact_sales
          depends_on:
            - task_key: dim_customer
            - task_key: dim_date
            - task_key: dim_employee
            - task_key: dim_track
            - task_key: clean_sales
          sql_task:
            file:
              path: ./src/sql/03_mart/05_fact_sales.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: source_checks
          depends_on:
            - task_key: raw_customer
            - task_key: raw_sales
            - task_key: raw_employee
            - task_key: raw_music
          sql_task:
            file:
              path: ./tests/01_source_checks.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: clean_checks
          depends_on:
            - task_key: clean_customer
            - task_key: clean_sales
            - task_key: clean_employee
            - task_key: clean_music
          sql_task:
            file:
              path: ./tests/02_clean_checks.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: mart_checks
          depends_on:
            - task_key: fact_sales
          sql_task:
            file:
              path: ./tests/03_mart_checks.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: top_revenue_genre_country
          depends_on:
            - task_key: fact_sales
          sql_task:
            file:
              path: ./src/sql/04_analytics/01_top_revenue_genre_country.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: customer_spending_tiers
          depends_on:
            - task_key: fact_sales
          sql_task:
            file:
              path: ./src/sql/04_analytics/02_customer_spending_tiers.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: monthly_sales_trend
          depends_on:
            - task_key: fact_sales
          sql_task:
            file:
              path: ./src/sql/04_analytics/03_monthly_sales_trend.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: employee_sales_performance
          depends_on:
            - task_key: fact_sales
          sql_task:
            file:
              path: ./src/sql/04_analytics/04_employee_sales_performance.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: track_popularity
          depends_on:
            - task_key: fact_sales
          sql_task:
            file:
              path: ./src/sql/04_analytics/05_track_popularity_genre_playlist.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: regional_customer_behavior
          depends_on:
            - task_key: fact_sales
          sql_task:
            file:
              path: ./src/sql/04_analytics/06_regional_customer_behavior.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
        - task_key: business_query_checks
          depends_on:
            - task_key: fact_sales
          sql_task:
            file:
              path: ./tests/04_business_query_checks.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

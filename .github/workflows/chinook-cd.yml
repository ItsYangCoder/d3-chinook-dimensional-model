name: Chinook CD - Databricks

on:
  workflow_dispatch:
    inputs:
      target:
        description: Databricks deployment target
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
      run_job:
        description: Run the Chinook job after deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chinook-cd-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Databricks (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_BUNDLE_TARGET: ${{ inputs.target }}
      BUNDLE_VAR_warehouse_id: ${{ secrets.DATABRICKS_SQL_WAREHOUSE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check required Databricks settings
        shell: bash
        run: |
          set -euo pipefail

          for variable_name in DATABRICKS_HOST DATABRICKS_TOKEN BUNDLE_VAR_warehouse_id; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::${variable_name} is empty. Check the secrets in the ${{ inputs.target }} GitHub environment."
              exit 1
            fi
          done

          if [[ ! "${BUNDLE_VAR_warehouse_id}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::BUNDLE_VAR_warehouse_id must contain only the warehouse ID, without 'id', spaces, '.', or parentheses."
            exit 1
          fi

      - name: Validate Databricks bundle
        run: databricks bundle validate --target "${{ inputs.target }}"

      - name: Deploy Databricks bundle
        run: databricks bundle deploy --target "${{ inputs.target }}"

      - name: Run Chinook job
        if: ${{ inputs.run_job == true }}
        run: databricks bundle run chinook_pipeline --target "${{ inputs.target }}"
